name: StockPet
options:
  bundleIdPrefix: com.bingge
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: 0.4.1
    CODE_SIGN_STYLE: Automatic
targets:
  StockPet:
    type: application
    platform: macOS
    sources:
      - path: StockPet
      - path: ChineseResources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bingge.StockPet
        PRODUCT_NAME: StockPet
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 盘宠 StockPet
        INFOPLIST_KEY_CFBundleDevelopmentRegion: zh_CN
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "仅供个人辅助查看，不构成投资建议"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - StockPetTests
  StockPetEnglish:
    type: application
    platform: macOS
    sources:
      - path: StockPet
      - path: EnglishResources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bingge.StockPetEnglish
        PRODUCT_NAME: StockPetEnglish
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ENGLISH_BUILD"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Stock Pet
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "For personal reference only. Not investment advice."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - StockPetEnglishTests
  StockPetEnglishTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StockPetEnglishTests
    dependencies:
      - target: StockPetEnglish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bingge.StockPetEnglishTests
        GENERATE_INFOPLIST_FILE: YES
  StockPetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StockPetTests
    dependencies:
      - target: StockPet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bingge.StockPetTests
        GENERATE_INFOPLIST_FILE: YES
